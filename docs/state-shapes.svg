<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="monospace" font-size="12" role="img" aria-label="The seven shapes a state field can be drawn as, and one component box using them.">
<title>Ply state-field shapes — proposal, hand-drawn</title>
<defs>
  <pattern id="hatch" width="4" height="4" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="4" height="4" fill="#fff"/><rect width="1.4" height="4" fill="#c8ccd4"/>
  </pattern>
</defs>
<style>
 .ink{fill:#1f2430} .out{fill:none;stroke:#1f2430;stroke-width:1.4}
 .lbl{fill:#333a45;font-size:11px} .nm{fill:#1f2430;font-size:12px;font-weight:bold}
 .frame{fill:#fbfbfd;stroke:#c8ccd4;stroke-width:2}
 .cbox{fill:#d2d7de;stroke:#3b4252;stroke-width:1.5}
 .fld{fill:#1f2430;font-size:11px} .ftype{fill:#6b7280;font-size:10px}
 .hd{fill:#6b7280;font-size:11px}
</style>
<rect class="frame" x="1" y="1" width="898" height="468" rx="8"/>
<text class="nm" x="28" y="30">A state field's shape — one glyph each, ink only, no new colour</text>
<text class="hd" x="28" y="48">Hand-drawn proposal for §7.1. Not renderer output; nothing regenerates this.</text>

<g transform="translate(40,84)">
  <g><rect class="ink" x="0" y="0" width="10" height="10" rx="1.5"/>
     <text class="nm" x="28" y="9">scalar</text><text class="lbl" x="28" y="26">u64, bool, f64</text></g>
  <g transform="translate(270,0)"><rect class="out" x="0" y="0" width="15" height="10" rx="1.5"/>
     <rect class="ink" x="2.5" y="6.4" width="10" height="1.8"/>
     <text class="nm" x="31" y="9">text</text><text class="lbl" x="31" y="26">String, &amp;str</text></g>
</g>
<g transform="translate(40,152)">
  <g><rect class="ink" x="0" y="0" width="15" height="2.6"/><rect class="ink" x="0" y="4.4" width="15" height="2.6"/><rect class="ink" x="0" y="8.8" width="15" height="2.6"/>
     <text class="nm" x="31" y="9">list</text><text class="lbl" x="31" y="26">Vec, array, slice — in order</text></g>
  <g transform="translate(270,0)">
     <rect class="ink" x="0" y="0" width="5" height="4.6"/><rect class="out" x="7" y="0" width="12" height="4.6"/>
     <rect class="ink" x="0" y="6.8" width="5" height="4.6"/><rect class="out" x="7" y="6.8" width="12" height="4.6"/>
     <text class="nm" x="33" y="9">map</text><text class="lbl" x="33" y="26">key beside value</text></g>
</g>
<g transform="translate(40,220)">
  <g><rect class="ink" x="0" y="0" width="6" height="6" rx="3"/><rect class="ink" x="9" y="4.5" width="6" height="6" rx="3"/><rect class="ink" x="3.5" y="9" width="6" height="6" rx="3"/>
     <text class="nm" x="31" y="9">set</text><text class="lbl" x="31" y="26">each one once, no order</text></g>
  <g transform="translate(270,0)"><rect class="out" x="0" y="0" width="12" height="10" rx="1.5" stroke-dasharray="3 2.4"/>
     <text class="nm" x="31" y="9">might be missing</text><text class="lbl" x="31" y="26">Option</text></g>
</g>
<g transform="translate(40,292)">
  <g><rect class="out" x="4" y="0" width="12" height="9" rx="1.5"/><rect class="out" x="0" y="4" width="12" height="9" rx="1.5" fill="#fbfbfd"/>
     <text class="nm" x="33" y="9">a shape of your own</text><text class="lbl" x="33" y="26">struct or enum — there is more inside</text></g>
</g>
<g transform="translate(40,364)">
  <g><rect x="0" y="0" width="14" height="12" rx="2" fill="url(#hatch)" stroke="#1f2430" stroke-width="1.4" stroke-dasharray="3 2.4"/>
     <text class="nm" x="33" y="9">nothing Ply can make one of</text><text class="lbl" x="33" y="26">the hatching unchecked code already carries — no eighth form</text></g>
</g>

<g transform="translate(560,84)">
  <rect class="cbox" x="0" y="0" width="300" height="230" rx="6"/>
  <text class="nm" x="16" y="24">book</text>
  <text class="ftype" x="16" y="40">ingest::book</text>
  <text class="ftype" x="16" y="60" font-style="italic">state OrderBook — 3 of 13 shown</text>
  <g transform="translate(18,76)">
    <rect class="ink" x="0" y="2" width="5" height="4.6"/><rect class="out" x="7" y="2" width="12" height="4.6"/>
    <rect class="ink" x="0" y="8.8" width="5" height="4.6"/><rect class="out" x="7" y="8.8" width="12" height="4.6"/>
    <text class="fld" x="34" y="13">bids</text><text class="ftype" x="86" y="13">Price → Level</text></g>
  <g transform="translate(18,112)">
    <rect class="ink" x="2" y="2" width="15" height="2.6"/><rect class="ink" x="2" y="6.4" width="15" height="2.6"/><rect class="ink" x="2" y="10.8" width="15" height="2.6"/>
    <text class="fld" x="34" y="13">ticks</text><text class="ftype" x="86" y="13">Tick</text></g>
  <g transform="translate(18,148)">
    <rect x="2" y="1" width="15" height="13" rx="2" fill="url(#hatch)" stroke="#1f2430" stroke-width="1.4" stroke-dasharray="3 2.4"/>
    <text class="fld" x="34" y="13">clock</text><text class="ftype" x="86" y="13">SystemTime</text></g>
  <text class="ftype" x="18" y="200">the hatched row is why this component's</text>
  <text class="ftype" x="18" y="214">functions report unsupported</text>
</g>
</svg>
