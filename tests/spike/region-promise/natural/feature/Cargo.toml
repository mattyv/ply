[workspace]
# Empty table: its own workspace root, per the tests/spike convention.

[package]
name = "havoc-natural-billing"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
catalog = { package = "havoc-natural-catalog", path = "../legacy" }

[features]
# PROMISES.md B1-tight: the same region promise at the tightest ceiling still
# true of `catalog` as written (500_000). Pre-registered, not a mutation --
# run.sh turns it on for its own row so the committed harness stays unedited.
tight = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lib]
name = "billing"
path = "src/lib.rs"
