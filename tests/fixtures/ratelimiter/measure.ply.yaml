ply: 1

# A MEASURING INSTRUMENT, not a design -- see The Task (2026-08-26,
# "add usize/isize/NonZero family/Duration"). This file claims every public
# function of the Flowgate rate limiter (tests/fixtures/ratelimiter/src/),
# a crate written by someone told nothing about Ply, so that
# `cargo ply check`/`cargo ply verify` measure Ply's real coverage of
# ordinary Rust rather than code shaped for Ply. Do NOT add `ply::`
# attributes to the ratelimiter's source, and do NOT edit this file to make
# more of it resolve -- the moment it is bent toward Ply it stops
# measuring anything (task instructions, repeated for anyone re-running this
# later).
#
# Every entry below is a real public item, named the way a caller of this
# crate would write it (`module::Type::method`, or `module::function` for a
# free function). No `checks:` is set anywhere: none of these functions
# carry a `#[ply::requires]`/`#[ply::ensures]` (the source is untouched), so
# the shape-aware default (§5.4c) is "none" regardless of signature -- the
# type-support question this file exists to measure is answered by *why*
# each claim fails, not by which check ran.

components:
  ratelimiter:
    anchor: flowgate
    fns:
      # -- quota.rs --------------------------------------------------------
      quota::RefillRate::new: {}
      quota::RefillRate::per_second: {}
      quota::RefillRate::tokens: {}
      quota::RefillRate::interval: {}
      quota::Quota::new: {}
      quota::Quota::capacity: {}
      quota::Quota::refill: {}

      # -- bucket.rs --------------------------------------------------------
      bucket::TokenBucket::new: {}
      bucket::TokenBucket::quota: {}
      bucket::TokenBucket::check: {}
      bucket::TokenBucket::check_n: {}
      bucket::TokenBucket::time_until_ready: {}

      # -- clock.rs ---------------------------------------------------------
      clock::Clock::now: {}
      clock::Clock::duration_since: {}
      clock::MonotonicClock::now: {}
      clock::MonotonicClock::duration_since: {}
      clock::WallClock::now: {}
      clock::WallClock::duration_since: {}
      clock::FakeClock::new: {}
      clock::FakeClock::advance: {}
      clock::FakeClock::set: {}
      clock::FakeClock::now_impl: {}
      clock::FakeClock::duration_since_impl: {}

      # -- decision.rs --------------------------------------------------------
      decision::Decision::is_allowed: {}

      # -- keyed.rs --------------------------------------------------------
      keyed::KeyedRateLimiter::new: {}
      keyed::KeyedRateLimiter::with_hasher: {}
      keyed::KeyedRateLimiter::check: {}
      keyed::KeyedRateLimiter::check_n: {}
      keyed::KeyedRateLimiter::sweep: {}
      keyed::KeyedRateLimiter::len: {}
      keyed::KeyedRateLimiter::is_empty: {}
      keyed::KeyedRateLimiter::remove: {}
      keyed::KeyedRateLimiter::shard_index: {}

      # -- keyed_config.rs --------------------------------------------------------
      keyed_config::KeyedLimiterConfig::new: {}

      # -- rate_limiter.rs --------------------------------------------------------
      rate_limiter::RateLimiter::check: {}
      rate_limiter::RateLimiter::check_n: {}
      rate_limiter::TokenBucket::check_n_impl: {}
      rate_limiter::KeyedRateLimiter::check_n_impl: {}

      # -- internal.rs (pub(crate), still counted -- it is the one function
      #    with a real contract-shaped signature: a plain free function) ----
      internal::refill_and_debit: {}

# Measured result (2026-08-27, cargo ply check and cargo ply verify, both
# run against this exact file copied to ply.yaml): 1 of these 39 claims
# resolves to a real function at all -- `internal::refill_and_debit`, the
# one plain free function above every other entry names a method or an
# associated function. `crates/ply-core/src/callgraph.rs`'s resolver (read,
# not guessed) indexes only `syn::Item::Fn` reachable by module path; it has
# no `syn::Item::Impl` arm at all, so a claim naming any method resolves to
# nothing (E0301, "could not find a function"), regardless of what types its
# parameters use. This is a real, separate, out-of-scope gap this task did
# not touch -- flagged, not fixed. `refill_and_debit` itself resolves but
# carries no `#[ply::]` contract (the source is untouched, per this task's
# rules), so it reports `unclaimed` and never reaches a type-support
# question either. Net: `check`/`verify` against this file answer nothing
# about type-mapping coverage before or after this task's change -- see
# `tests/e2e/tests/ratelimiter_type_coverage.rs` for the measurement that
# does, reading `ply_core::harness::rust_type_from_source` directly against
# every parameter/return type on this crate's public surface.
