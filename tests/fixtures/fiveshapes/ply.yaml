# docs/review-structs-enums.md's "Also fix" list: five ordinary shapes that
# used to make the shared harness fail to compile, poisoning every function
# in the crate with a raw-compiler-output tool error. Each of the first,
# third, fourth and fifth must now be refused by name before generation; the
# second has a working fallback (direct field construction) and must
# actually be checked. `normal_fn` proves the rest of the crate stays
# checkable, and its own real bug is still found.
