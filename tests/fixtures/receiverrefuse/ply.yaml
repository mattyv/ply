ply: 1

components:
  receiverrefuse:
    anchor: ply_fixture_receiverrefuse
    fns:
      # No `Self`-returning associated function anywhere on `Gauge` -- no
      # constructor to call, so no receiver Ply can build.
      Gauge::read:
        checks: [fuzz(32)]
      # `Labelled::new` is a real constructor, but its own parameter is a
      # type Ply's checkers cannot build a value of -- the constructor
      # itself can never be called.
      Labelled::tag_value:
        checks: [fuzz(32)]
      # `Counter` is constructible and `bump` takes `&mut self` -- no
      # longer refused for that (2026-09-07). It carries no promise, so it
      # reports as making no claims rather than as a shape Ply cannot check.
      Counter::bump: {}
      # Owned `self`: the one receiver shape still refused.
      Ledger::into_total:
        checks: [fuzz(32)]
