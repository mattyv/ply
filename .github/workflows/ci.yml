name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # What kind of change this is: `code`, or `docs` for a change that touches
  # only documentation. The slow jobs below -- the end-to-end suite behind a
  # Kani install, and the kernel mutation run -- skip on `docs`, because
  # nothing they run reads a document. The fast `product` job never skips:
  # it is where documentation *is* checked (the spec-consistency test, the
  # drawing drift check), so a docs change still gets every check that can
  # see it. The classification lives in a script rather than here so the
  # exact code CI runs can be run by hand against a real range; the script's
  # own comment says what counts as documentation and why the default for
  # anything unrecognised is "code".
  changes:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: a pull request is classified against its
          # merge base with main, and a push against the commit before it.
          fetch-depth: 0

      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base "origin/$BASE_REF" HEAD)
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            base="$BEFORE"
          else
            # A push with no usable "before" (a new branch): nothing to
            # classify against, so the safe answer is the full suite.
            echo "kind=code" >> "$GITHUB_OUTPUT"
            echo "no base to classify against; running everything"
            exit 0
          fi
          kind=$(.github/scripts/changed-kind.sh "$base" HEAD)
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "changed files are: $kind"
          git diff --name-only "$base" HEAD | sed 's/^/  /'

  # The whole workspace: the product (ply-attrs, ply-core, ply-cli) and the
  # spec-validation tooling (render, check, kernel, schedule), which was a
  # second workspace until 2026-08-30. Fast signal: no
  # engines needed, so it stays a couple of minutes. ply-e2e is excluded here
  # and gated by the `product-e2e` job below, which has to install Kani.
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (unit, engine-free)
        run: cargo test --workspace --exclude ply-e2e

      # Folded in from the `tools` job when the two workspaces merged on
      # 2026-08-30. One `cargo test --workspace` above now runs the
      # renderer's own suite alongside the code it tests -- they were
      # separated before, which is how a green test came to pin a sentence
      # that was false. What survives here is the two things the unit suite
      # cannot do: run the validator against the vetting scenarios as a user
      # would, and prove the committed drawings still match what the
      # renderer produces.
      - name: ply-check vetting scenarios
        run: |
          cargo run -q -p ply-check -- vetting/001-spsc-disruptor.ply.yaml
          cargo run -q -p ply-check -- vetting/002-ingest-pipeline.ply.yaml

      - name: rendered-artifact drift check
        run: |
          cargo run -q -p ply-render -- vetting/001-spsc-disruptor.ply.yaml -o vetting/001-spsc-disruptor.svg
          cargo run -q -p ply-render -- vetting/002-ingest-pipeline.ply.yaml -o vetting/002-ingest-pipeline.svg
          git diff --exit-code vetting

  # Plants bugs in the verdict kernel one at a time and checks the exhaustive
  # tree check notices each one. This does not check the kernel -- the
  # exhaustive check does that. It checks THE CHECK: whether the gate that
  # must stay green can actually see. That is a measured property, not a
  # standing one. It was measured once by hand on 2026-08-25, four planted
  # bugs walked straight past, and nothing kept the repair true afterwards;
  # this job is what keeps it true. Every surviving bug is a real gap or a
  # real piece of dead code, so the bar is zero survivors and there is
  # deliberately no excused-failures list -- such a list is where genuine
  # gaps go to be forgotten. If a survivor appears, read it before silencing
  # it: the first run found an unused method, an unpinned constructor, and a
  # blanked failure message that would have left every future counterexample
  # unreadable while every test still passed.
  #
  # --in-place rather than the default copy: the copy pulls in gigabytes of
  # unrelated fixture build output and filled a 250GB disk mid-run.
  # --profile release because the exhaustive check walks 991,389 trees --
  # 2.3s optimised, far longer unoptimised, once per planted bug.
  kernel-mutants:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.kind == 'code'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: kernel-mutants

      - name: Install cargo-mutants
        run: cargo install --locked --version 27.1.0 cargo-mutants

      - name: Plant bugs in the kernel and require the check to catch every one
        run: |
          cargo mutants --in-place --profile release \
            --file crates/ply-core/src/kernel.rs \
            --test-package ply-core

      - name: Name any bug that survived
        if: failure()
        run: |
          echo "These planted bugs were not caught. Each is a real gap or"
          echo "real dead code -- triage it, do not add it to an ignore list:"
          cat mutants.out/missed.txt || true

  # End-to-end: drives real Kani, proptest and cargo-mutants, so it is slow
  # (minutes per proof) and needs a ~1GB toolchain. Separated so the fast
  # signal above is not held hostage to it; still gates merges to main.
  product-e2e:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.kind == 'code'
    # The suite is 82 independent test binaries and it ran as one job for
    # over an hour, which is most of the wait on every pull request. They
    # have nothing to say to each other, so they are split across parallel
    # runners: wall clock becomes roughly the slowest shard rather than the
    # sum, with no change to any test or to what is actually checked.
    #
    # The split is computed at run time from the files on disk, not written
    # down here, so a test added later is picked up by whichever shard its
    # position falls in and can never be silently left out of all of them --
    # a hand-maintained list would rot the first time someone forgot it, and
    # a test nobody runs is exactly the kind of absence this project treats
    # as a defect. Round-robin rather than contiguous blocks, so the slow
    # Kani-backed tests -- which sit together alphabetically -- land in
    # different shards instead of all in one.
    #
    # The honest cost: every shard pays the engine install, which the cache
    # makes cheap but not free, so the real figure is above total/4.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: product-e2e (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e

      # ADR-0003 pins the Kani version every verdict's fingerprint records;
      # a drifting engine version silently invalidates recorded evidence
      # (D9/D14), so this is pinned rather than latest.
      - name: Cache Kani toolchain
        uses: actions/cache@v4
        with:
          path: ~/.kani
          key: kani-0.67.0-${{ runner.os }}

      - name: Install engines
        run: |
          cargo install --locked --version 0.67.0 kani-verifier
          cargo kani setup
          cargo install --locked --version 27.1.0 cargo-mutants
          cargo kani --version
          cargo mutants --version

      - name: cargo test -p ply-e2e (shard ${{ matrix.shard }} of 4)
        run: |
          set -euo pipefail
          targets=$(ls tests/e2e/tests/*.rs \
            | sed 's|.*/||; s|\.rs$||' \
            | sort \
            | awk -v s=${{ matrix.shard }} -v n=4 '(NR-1) % n == s')
          if [ -z "$targets" ]; then
            echo "shard ${{ matrix.shard }} has no test targets -- there are fewer test files"
            echo "than shards, which means this matrix is wider than it needs to be."
            exit 1
          fi
          echo "$targets" | sed 's/^/  /'
          args=$(echo "$targets" | sed 's/^/--test /' | tr '\n' ' ')
          # shellcheck disable=SC2086
          cargo test -p ply-e2e $args

  # Ply, run against its own two documents (`crates/ply-core/ply.yaml`,
  # `crates/ply-cli/ply.yaml`) -- the thing every other job in this file
  # takes on faith. Until this job existed, every claim built up over
  # 2026-09-04/05 (44 promises about ply-core, 6 about ply-cli, all earning
  # real evidence) had only ever been checked by hand, on one machine,
  # never by CI -- so nothing stopped either document quietly drifting out
  # of truth the next time the code under it changed.
  #
  # `--fail-on error` rather than the default (`evidence`): one function
  # (`record::fingerprint`) is refused by name for a documented reason (a
  # struct with two fields Ply cannot yet build through) and is warning
  # severity, not error -- a known, recorded gap, not a regression. The
  # default would fail this job on that gap forever, which is exactly the
  # "excused failure nobody looks at again" shape `kernel-mutants`' own
  # comment above warns against. `error` still fails on anything that
  # actually breaks: a broken promise reports as an error-severity
  # violation, and a harness that stops compiling reports as an
  # error-severity tool error -- both confirmed by `cargo ply explain`
  # before this was written, neither tolerated here.
  #
  # `--svg` writes the real, evidence-coloured drawing -- the picture
  # `cargo ply render` cannot draw, because it only ever reads the document
  # and never runs anything. This is what makes the claims in this file
  # visible as something other than a paragraph in a commit message: open
  # the run, download the drawing, see which chips this exact commit
  # actually earned.
  ply-self-check:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.kind == 'code'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ply-self-check

      - name: Build cargo-ply
        run: cargo build -p ply-cli

      - name: Ply verifies its own library
        run: |
          ./target/debug/cargo-ply verify crates/ply-core \
            --fail-on error --svg ply-core-verified.svg

      - name: Ply verifies its own command line
        run: |
          ./target/debug/cargo-ply verify crates/ply-cli \
            --fail-on error --svg ply-cli-verified.svg

      # `if: always()` so a drawing from a run that just failed is still
      # attached -- that is the one a reader most wants, since it shows
      # exactly which chip stopped earning what it used to.
      - name: Upload the verified drawings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ply-self-check-drawings
          path: |
            ply-core-verified.svg
            ply-cli-verified.svg
          if-no-files-found: ignore

  # The one check to require on `main`, and the only one whose name is
  # fixed. It depends on every job above and does nothing else, so two
  # things become safe that were not:
  #
  #   - The shard count can change. Requiring `product-e2e (0/4)` by name
  #     meant going to six shards left a pull request waiting forever on a
  #     check that would never report again -- a *missing* check, which is
  #     the harder kind to read. Requiring this instead means the shard
  #     names never matter.
  #   - The slow jobs can skip. A skipped job is not a passed one, and a
  #     rule that requires a shard directly is at the mercy of how the
  #     forge treats "skipped". This job treats it explicitly: skipped is
  #     fine, failed or cancelled is not.
  #
  # `if: always()` so it runs -- and reports -- even when something above
  # failed; a gate that is itself skipped on failure would report nothing,
  # which is the missing-check problem again.
  ci-gate:
    runs-on: ubuntu-latest
    needs: [changes, product, kernel-mutants, product-e2e, ply-self-check]
    if: always()
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "changes:        ${{ needs.changes.result }}"
          echo "product:        ${{ needs.product.result }}"
          echo "kernel-mutants: ${{ needs.kernel-mutants.result }}"
          echo "product-e2e:    ${{ needs.product-e2e.result }}"
          echo "ply-self-check: ${{ needs.ply-self-check.result }}"
          exit 1
      - name: Every job passed or had nothing to do
        run: |
          echo "changes:        ${{ needs.changes.result }}"
          echo "product:        ${{ needs.product.result }}"
          echo "kernel-mutants: ${{ needs.kernel-mutants.result }}"
          echo "product-e2e:    ${{ needs.product-e2e.result }}"
          echo "ply-self-check: ${{ needs.ply-self-check.result }}"
