ply: 1

# Ply's own architecture, checked by Ply (§5.3, M2's self-host requirement).
#
# Deliberately small. This file declares only what the crate tier can actually
# check today -- which crates exist and which may depend on which. Capability
# declarations (`pure`, `uses`) and type ownership (`owns`) are item-tier
# facts, and the item tier is not built: declaring them here would put
# unchecked promises in the one file whose whole purpose is that its claims
# are checked. They arrive when the tier that checks them does.
#
# The three rules below are real invariants of this codebase, not decoration:
#
#   attrs  stands alone. It is a proc-macro crate, compiled for the host
#          rather than the target. A dependency from it into the library
#          would compile and would be wrong -- the macro would start
#          depending on the thing it exists to annotate.
#   core   holds the model, the engines and the record. It must never reach
#          up into the command-line layer: everything core does has to be
#          usable without a terminal, which is what makes the engines
#          testable at all.
#   cli    is the only component allowed to depend on core, and nothing may
#          depend on cli. It is the top of the stack by construction.
#
# The one edge at the foot of this file is therefore the whole permitted
# graph. Anything else between these crates is a violation, including the
# cycle a well-meaning refactor would create by moving a diagnostic's
# wording into core's caller.

components:
  # The end-to-end suite. It carries no dependency on any of the three
  # crates below, and that is the rule rather than an accident: it drives the
  # real built binary the way a user does. The day it links the library
  # directly it stops testing what ships, and the checker will say so --
  # there is no edge from `e2e` to anything, so any such dependency is a
  # violation.
  #
  # It had grown one. On 2026-08-28 this checker, run on its own repository,
  # reported that `ply_e2e` depended on `ply_core` and nothing allowed it: a
  # measurement test was reading the type classifier directly. The fix was to
  # move that test next to the classifier it measures, in `ply-core`'s own
  # tests, where the dependency is native and the rule here is intact again.
  # Declaring an edge would have widened the rule to the whole suite in order
  # to excuse one file -- the crate tier cannot say "one test file may".
  e2e:
    anchor: ply_e2e
    # What a run of the built binary comes back as: the machine-readable
    # envelope, and the exit code the shell would have seen. Both, because a
    # suite that reads only one of them can pass on a run that told the user
    # something different from what it told the test.
    state:
      of: VerifyRun
      show: [json, exit_code]
    # Also carries no promises, and here the reason is a rule rather than an
    # absence (2026-09-06). Its three hundred-odd lines are test scaffolding:
    # copy a fixture, run the binary, read what came back -- filesystem work
    # with no promise in it. And pointing Ply at its own test harness is the
    # circularity `docs/plans/evidence-integrity.md` exists to rule out: the
    # suite that judges Ply must not be judged by Ply.
    note: >-
      Drives the built binary the way a user does, and depends on nothing.
      A suite that links the library instead stops testing what ships. It
      had grown exactly that dependency once; the fix was to move the test
      rather than widen the rule.
  attrs:
    anchor: ply_attrs
    # Draws with no promises on it, and that is the honest picture rather
    # than an oversight (asked about 2026-09-06; this is the answer). There
    # is no `crates/ply-attrs/ply.yaml`, because there is nothing here Ply
    # can check. All three public entry points take a stream of compiler
    # tokens and hand one back, and Ply builds inputs by choosing values --
    # it cannot manufacture a token stream, and a proc-macro crate's
    # functions cannot be called from an ordinary test at all. One private
    # helper underneath is an ordinary function, and making it public so Ply
    # could see it would be shaping the code to suit the checker, which this
    # repository refuses about its own kernel and refuses here for the same
    # reason.
    note: >-
      Stands alone. It is a proc-macro crate, compiled for the machine doing
      the building rather than the machine the program will run on, so a
      dependency from here into the library would compile perfectly well and
      would be wrong: the macro would begin depending on the very thing it
      exists to annotate.
  core:
    anchor: ply_core
    # Deliberately no `state:` and no `components:` here (removed
    # 2026-09-04, the derive-document-links change). This document used to
    # hand-declare five nested modules and an `Envelope` state block as a
    # copy of what `crates/ply-core/ply.yaml` says about itself -- two
    # descriptions of one thing, and they had already drifted: this file
    # said five modules, the real document said twenty-one.
    #
    # There is no `include:` key. A component links to another document
    # when that document's own top-level anchor equals, or sits under, this
    # component's anchor (The-Ply-Spec.md §7.1) -- derived from the real
    # crate directory `ply_core` names, not declared here. `crates/ply-core/
    # ply.yaml` is the one description of what `core` holds, and its whole
    # interior is drawn here in place, as though written below: twenty-one
    # components and forty-four promises, none of them repeated in this
    # file. The box names that file on its anchor line, so a reader who
    # wants to change any of it knows where to go.
    #
    # It drew collapsed -- one box saying "look in that file" -- until
    # 2026-09-05, and folding is now the reader's choice (`--depth`,
    # `--focus`, the viewer's own control) rather than the only option.
    #
    # Do not restore a `state:` or `components:` block here: the moment
    # either exists again, it is a second copy the two files can drift
    # apart on, and the derived link stops being consulted for this box (a
    # component that already declares real content never looks at a link --
    # see `render_component_dispatch` in
    # `crates/ply-core/src/visual/svg.rs`).
    note: >-
      Everything Ply knows how to do, with no terminal attached. It must
      never reach up into the command-line layer: that constraint is what
      makes the engine adapters testable at all, because the moment a
      diagnostic's wording lives here, the wording and the engine can only
      be tested together.
  cli:
    anchor: ply_cli
    # Deliberately no `state:` and no `components:` -- moved into
    # `crates/ply-cli/ply.yaml` on 2026-09-06, for the reason recorded on
    # `core` below. Declaring an interior here makes this component
    # non-hollow, and a component that declares its own interior never
    # consults a link, so this box read "2 components, 0 fns" while that
    # file's six promises all sat green. Do not restore either key.

  # The spec-validation tooling, which lived in a second cargo workspace
  # until 2026-08-30 and so was absent from this document entirely -- Ply's
  # own file describing half of Ply's own crates. The workspaces were merged
  # because the split was historical rather than principled (every crate here
  # already depended on `core`), and these four arrive with it.
  #
  # Each depends on `core`, which is the honest direction: the product owns
  # the `ply.yaml` model and this tooling consumes it.
  #
  # There were four. `kernel` and `schedule` were deleted on 2026-09-02: the
  # first was a crate whose entire body was one re-export, the second held a
  # rule nothing ran that was looser than the one that ships. Ply reported
  # their absence here itself (A0410, "this component owns no crate at all,
  # and every edge written for it is silently inert") before this file was
  # corrected -- which is the check this document exists to be subject to.
  render:
    anchor: ply_render
    # No promises here either, for a different reason (2026-09-06): this
    # crate's library is re-exports and nothing else -- every function it
    # appears to offer belongs to `core` and is claimed there, where the code
    # is. The one genuinely promisable function of its own turns a `--depth`
    # argument into a number, and it lives in the binary, where no harness
    # can reach it. Moving it into the library purely so Ply could claim it
    # is the same refusal as `attrs` above.
    # No `state:` here, deliberately. This library is a facade over
    # `ply_core::visual` (see `tools/render/src/lib.rs`) and owns no struct
    # of its own, so the only type at this anchor is the binary's own parsed
    # arguments -- which is not what this component *holds*, and `state:`
    # answers exactly that question. It was declared as `Cli` until
    # 2026-09-03 and removed for two reasons: the claim was a stretch, and
    # the `cli` component below has its own, different `Cli`, so the drawing
    # showed two boxes reading `state Cli` side by side and a reader could
    # not tell they were unrelated types. A picture nobody can read is worse
    # than one line less on it.
    note: >-
      Draws a document before any code exists, and writes the same facts as
      prose. It is the surface a reader judges the whole tool by, which is
      why its wording is tested by exact string rather than by shape.
  check:
    anchor: ply_check
    # Forty-six lines, one `main`, and every one of them reading a file,
    # printing a diagnostic or choosing an exit code (2026-09-06). There is
    # no function here with a promise in it, so there is nothing to write
    # down. A document declaring nothing would draw the same empty box while
    # implying somebody had looked -- worse than the empty box.
    note: >-
      The standalone spec validator, which predates the installed `cargo ply
      check` command and overlaps it. Retiring one of the two is recorded
      work, not a decision taken here.

edges:
  - "cli -> core"
  - "render -> core"
  - "check -> core"
