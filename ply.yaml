ply: 1

# Ply's own architecture, checked by Ply (§5.3, M2's self-host requirement).
#
# Deliberately small. This file declares only what the crate tier can actually
# check today -- which crates exist and which may depend on which. Capability
# declarations (`pure`, `uses`) and type ownership (`owns`) are item-tier
# facts, and the item tier is not built: declaring them here would put
# unchecked promises in the one file whose whole purpose is that its claims
# are checked. They arrive when the tier that checks them does.
#
# The three rules below are real invariants of this codebase, not decoration:
#
#   attrs  stands alone. It is a proc-macro crate, compiled for the host
#          rather than the target. A dependency from it into the library
#          would compile and would be wrong -- the macro would start
#          depending on the thing it exists to annotate.
#   core   holds the model, the engines and the record. It must never reach
#          up into the command-line layer: everything core does has to be
#          usable without a terminal, which is what makes the engines
#          testable at all.
#   cli    is the only component allowed to depend on core, and nothing may
#          depend on cli. It is the top of the stack by construction.
#
# The edges at the foot of this file are therefore the whole permitted
# graph. Anything else between these crates is a violation, including the
# cycle a well-meaning refactor would create by moving a diagnostic's
# wording into core's caller. The second edge is an exception argued for
# where it is declared, not a loosening of the three rules above.

components:
  # The end-to-end suite. It drives the real built binary the way a user
  # does, which is the point: a suite that links the library instead stops
  # testing what ships.
  #
  # It had no edge at all until 2026-08-28, when this checker -- run on its
  # own repository while writing ARCHITECTURE.md -- reported that `ply_e2e`
  # had grown a dependency on `ply_core` and nothing allowed it. The
  # dependency is real and wanted: one measurement test reads `ply_core`'s
  # own type classifier directly, so the count of what Ply accepts can never
  # drift into a second, hand-maintained idea of the same fact.
  #
  # The edge below is therefore an exception declared out loud rather than a
  # rule quietly abandoned, and it is wider than the exception deserves: the
  # crate tier can say "e2e may depend on core", not "one test file may".
  # Narrowing it to the single file is an item-tier fact, and the item tier
  # is not built. Until it is, this edge is load-bearing on a convention no
  # tool enforces -- everything in e2e except that one measurement must keep
  # driving the binary.
  e2e:
    anchor: ply_e2e
  attrs:
    anchor: ply_attrs
  core:
    anchor: ply_core
  cli:
    anchor: ply_cli

edges:
  - "cli -> core"
  - "e2e -> core"
