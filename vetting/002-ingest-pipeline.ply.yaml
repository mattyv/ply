ply: 1
components:
  feed:
    anchor: ingest::feed
    uses: [net]
    fns:
      Feed::pump:
        checks: []
  ring:
    anchor: disruptor::spsc
    uses: [unsafe]
    owns: [disruptor::spsc::Spsc]
    # Declared, not read: no crate backs this anchor. `slots` is the ordered,
    # many-slot buffer; each cursor is the one value it is.
    state:
      of: Spsc
      show:
        slots: list
        head: scalar
        tail: scalar
    profile: hot_path
    fns:
      Spsc::try_push:
        checks: [bounded(3)]
        check_with: { T: ingest::feed::RawFrame }
      Spsc::try_pop:
        checks: [bounded(3)]
        check_with: { T: ingest::feed::RawFrame }
  decoder:
    anchor: ingest::decode
    pure: true
    profile: hot_path
    fns:
      decode:
        checks: [bounded(2), fuzz(4096), mutate]
        examples:
          - "decode(&RawFrame::of(&[2, 1, 0, 100, 0, 42])).is_ok() == true"
  book:
    anchor: ingest::book
    strict: true
    owns: [ingest::book::OrderBook]
    # The same type this component owns, now also named as what it holds:
    # `owns` is who may change it, `state` is what is in it. Two fields of
    # the several a real book carries -- the ones a reader asks about first.
    # `bids` is a lookup keyed by price level; `last` is the one value the
    # last trade set.
    state:
      of: OrderBook
      show:
        bids: map
        last: scalar
    profile: hot_path
    fns:
      OrderBook::apply:
        checks: [bounded(2), fuzz(256), mutate]
      OrderBook::updates:
        checks: [bounded(2)]
      OrderBook::last_px:
        checks: [bounded(2)]
edges:
  - feed -> ring
  - decoder -> ring
  - decoder -> book
  - "feed ~> ring : RawFrame"
  - "ring ~> decoder : RawFrame"
  - "decoder ~> book : Tick"
deny:
  - "* -> book except decoder"
  - "* -> feed"
profiles:
  hot_path: [no_panics, exhaustive_match]
unresolved:
  - { id: 7, note: "backpressure policy when the ring is full: drop frame vs spin" }
