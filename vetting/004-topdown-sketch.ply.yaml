ply: 1
components:
  gateway:
    anchor: settle::gateway
    uses: [net]
  matcher:
    anchor: settle::matcher
  ledger:
    anchor: settle::ledger
  reporting:
    anchor: settle::reporting
    uses: [fs]
edges:
  - gateway -> matcher
  - matcher -> ledger
  - reporting -> ledger
  - "gateway ~> matcher : Instruction"
  - "matcher ~> ledger : Entry"
  - "ledger ~> reporting : Statement"
deny:
  - "* -> ledger except matcher, reporting"
  - "ledger -> gateway"
unresolved:
  - { id: 10, note: "settlement finality: T+0 immediate or batched end-of-day" }
  - { id: 11, note: "ledger storage: append-only file or embedded db (decides the fs cap owner)" }
