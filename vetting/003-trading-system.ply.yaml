ply: 1
externals:
  venue:
    note: "the exchange: accepts orders, returns fills; market data source"
components:
  ingest:
    anchor: ingest
    components:
      feed:
        anchor: ingest::feed
        uses: [net]
        fns:
          Feed::pump:
            checks: []
      ring:
        anchor: disruptor::spsc
        uses: [unsafe]
        owns: [disruptor::spsc::Spsc]
        state:
          of: Spsc
          show: [slots, head, tail]
        profile: hot_path
        fns:
          Spsc::try_push:
            checks: [bounded(3)]
            check_with: { T: ingest::feed::RawFrame }
          Spsc::try_pop:
            checks: [bounded(3)]
            check_with: { T: ingest::feed::RawFrame }
      decoder:
        anchor: ingest::decode
        pure: true
        profile: hot_path
        fns:
          decode:
            checks: [bounded(2), fuzz(4096), mutate]
            examples:
              - "decode(&RawFrame::of(&[2, 1, 0, 100, 0, 42])).is_ok() == true"
      book:
        anchor: ingest::book
        strict: true
        owns: [ingest::book::OrderBook]
        state:
          of: OrderBook
          show: [bids, asks, last]
        profile: hot_path
        fns:
          OrderBook::apply:
            checks: [bounded(2), fuzz(256), mutate]
          OrderBook::updates:
            checks: [bounded(2)]
          OrderBook::last_px:
            checks: [bounded(2)]
  strategy:
    anchor: strat
    components:
      signals:
        anchor: strat::signals
        pure: true
        fns:
          momentum:
            checks: [bounded(2), fuzz(2048)]
    fns:
      Strategy::on_update:
        checks: [test]
  risk:
    anchor: risk
    strict: true
    owns: [risk::Limits]
    # No `state:` here, and this is a measurement rather than an oversight.
    # Every other component in this scenario carries one; adding a sixth
    # makes this box one line taller, and that pushes two routed lines onto
    # the same path -- the crossing ratchet in tools/render goes from 0 to 2,
    # which hides a declared rule. Bisected one component at a time: this is
    # the only one that does it. It goes in the day edge routing reroutes
    # when a box grows, not before.
    fns:
      check_order:
        checks: [bounded(3), fuzz(4096), mutate]
        requires:
          - "order.qty > 0 && order.px > 0"
        ensures:
          - "|r| r.is_err() == (order.qty > limits.max_qty)"
  oms:
    anchor: oms
    owns: [oms::OrderStore]
    state:
      of: OrderStore
      show: [open, by_client_id]
    fns:
      Oms::submit:
        checks: [bounded(2), fuzz(256)]
        entry: [venue]
        unresolved:
          - { id: 9, note: "order id after venue reject: fresh id or reuse" }
      Oms::on_fill:
        checks: [bounded(2)]
  gateway:
    anchor: gw
    uses: [net]
    fns:
      Gateway::send:
        checks: []
        trusted:
          - { claim: "venue protocol conformance",
              evidence: "exchange certification suite, 2026-Q2 run" }
  pnl:
    anchor: pnl
    owns: [pnl::Positions]
    state:
      of: Positions
      show: [by_symbol, realised]
    fns:
      Positions::apply_fill:
        checks: [bounded(2), fuzz(512)]
edges:
  - ingest.feed -> ingest.ring
  - ingest.decoder -> ingest.ring
  - ingest.decoder -> ingest.book
  - "ingest.feed ~> ingest.ring : RawFrame"
  - "ingest.ring ~> ingest.decoder : RawFrame"
  - "ingest.decoder ~> ingest.book : Tick"
  - strategy -> ingest.book
  - strategy -> oms
  - oms -> risk
  - oms -> gateway
  - oms -> pnl
  - "ingest.book ~> strategy : BookUpdate"
  - "strategy ~> oms : OrderIntent"
  - "oms ~> gateway : Order"
  - "gateway ~> oms : Fill"
  - "oms ~> pnl : Fill"
  - "gateway ~> venue : FixMessage"
  - "venue ~> gateway : Fill"
  - "venue ~> ingest.feed : RawFrame"
deny:
  - "* -> gateway except oms"
  - "* -> risk except oms"
  - "* -> ingest.book except ingest.decoder, strategy"
profiles:
  hot_path: [no_panics, exhaustive_match]
unresolved:
  - { id: 8, note: "venue failover: mirror orders to a backup gateway or halt" }
