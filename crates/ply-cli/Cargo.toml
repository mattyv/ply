[package]
name = "ply-cli"
version = "0.2.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "cargo-ply: the Ply CLI (verify, --json)."

[lib]
name = "ply_cli"
path = "src/lib.rs"

[[bin]]
name = "cargo-ply"
path = "src/main.rs"

[dependencies]
ply-core = { path = "../ply-core" }
clap = { version = "4", features = ["derive"] }
indexmap = "2"
serde_json = "1"
toml = "0.9"
anyhow = "1"
tempfile = "3"
libc = "0.2"

# build.rs computes PLY_BUILD_ID (The-Ply-Spec.md §5.2a input 11) by hashing
# Ply's own first-party source -- same blake3 version ply-core hashes
# fingerprints with, pinned identically so the two never quietly diverge.
[build-dependencies]
blake3 = "1.8.7"
