[package]
name = "ply-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Ply core: config, harness codegen, engine adapters, contract runtime rendering, diagnostics."

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
indexmap = { version = "2", features = ["serde"] }
anyhow = "1"
blake3 = "1.8.7"
# Already present in Cargo.lock as a transitive dependency (via `tempfile`'s
# `rustix`), so declaring it directly adds no new code to the build. Used to
# send SIGKILL to a pid this crate did not spawn itself -- see
# `engines::mod`'s `kill_descendants` -- which `std::process::Child::kill`
# cannot do, since it only ever targets the one pid it wraps.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Test-only: the shipping binary carries no regex engine. The schema's
# patterns are enforced by hand-written matchers, and these tests are what
# hold those matchers to the schema.
regex = "1"
