[package]
name = "ply-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Ply core: config, harness codegen, engine adapters, contract runtime rendering, diagnostics."

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
