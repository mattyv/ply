# Every key §5 defines, at every level it can appear.
ply: 1
externals:
  venue:
    note: "the exchange: accepts orders, returns fills"
components:
  pricing:
    anchor: app::pricing
    pure: true
    strict: true
    uses: [time, rand]
    owns: [app::pricing::Book]
    profile: hot_path
    checks: [bounded(2)]
    components:
      curves:
        anchor: app::pricing::curves
    fns:
      Quote::new:
        checks: [fuzz(256), test, mutate]
        mode: synth
        requires: ["inst.tick > 0"]
        ensures: ["|result| result.bid <= result.ask"]
        examples: ["Quote::new(1).bid == 4"]
        check_with: { T: u64 }
        trusted:
          - claim: "cross-thread safety"
            evidence: "loom test tests/loom_quote.rs"
        unresolved:
          - id: 147
            note: "employee discount undecided"
        entry: [venue]
edges:
  - "pricing ~> venue : app::pricing::Quote"
deny:
  - "* -> db_raw except migrations"
profiles:
  hot_path: [no_panics, no_trait_objects]
unresolved:
  - id: 151
    note: "settlement rounding rule TBD"
