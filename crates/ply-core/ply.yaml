ply: 1

# Ply's own library, described at the level where promises live.
#
# The workspace file one directory up says which crates exist and which may
# depend on which. It cannot carry function claims: Ply resolves those against
# a single crate's `src/lib.rs`, and a workspace root has none -- it says so
# rather than reporting zero problems ("this is not a count of zero problems,
# it is a count of zero searches"). So the function-level picture lives here.
#
# The modules are nested components, and each carries its own functions. That
# became possible on 2026-09-04: a function key is now read relative to its
# component's own anchor, so `StatusSet::len` written inside the box anchored
# at `ply_core::kernel` resolves to `kernel::StatusSet::len` and runs. Until
# then a key was read from the crate root, so a claim written inside a
# module-anchored box was drawn, counted, and never checked -- which is why
# this file used to hold one crate-wide box with the module carried in each
# function's name, and said so in this comment.
#
# Every promise below can be checked against the code by eye, and every one of
# them is now folded into the function's own check (§5.4's "ANDed in").

components:
  core:
    anchor: ply_core
    note: >-
      Everything Ply knows how to do, with no terminal attached.
    # What this component holds. The type and every named field are resolved
    # against the real source when `cargo ply check` runs -- a field nobody
    # declared is refused by name, never drawn, and the shape drawn beside
    # each one is read from the code rather than written here. Four fields of
    # eight: what was asked for, the tree of verdicts it produced, the
    # diagnostics beside that, and the coverage that may or may not be there.
    state:
      of: Envelope
      show: [command, root, diagnostics, coverage]
    components:
      kernel:
        anchor: ply_core::kernel
        # What the status set must always be true of itself, whatever has
        # been inserted into it. There are seven kinds of status, so a set of
        # them can never hold more than seven -- and the whole point of
        # writing it here is that the claim is now checked rather than
        # assumed: Ply builds a set through its own constructor, inserts and
        # merges through its own operations, and looks again after each one.
        state:
          of: StatusSet
          holds:
            - "state.len() <= 7"
        note: >-
          Decides what a pile of results adds up to: the order that ranks one
          kind of evidence above another, the rule that a parent is never
          reported as stronger than its weakest part, and the flags that
          travel upward beside a verdict without being confused for one.
        fns:
          StatusSet::len:
            ensures:
              - "result <= 7"
            checks: [fuzz(256)]
          StatusSet::union:
            ensures:
              - "result.len() >= self.len()"
            checks: [fuzz(256)]
          StatusSet::is_empty:
            # Checked against `len`'s own, independent code path rather than
            # restating either one: "empty" and "holds nothing to count" are
            # two different pieces of code, and this is what stops them
            # disagreeing about the same set.
            ensures:
              - "result == (self.len() == 0)"
            checks: [fuzz(256)]
      harness:
        anchor: ply_core::harness
        state:
          of: ContractFn
          show: [name, params, requires, ensures]
        note: >-
          Works out what a function's inputs are and whether Ply can make one
          of each. This is the part that decides whether a function can be
          checked at all, and it is where a refusal gets its reason.
        fns:
          last_two_segments:
            ensures:
              - "!result.is_empty() || path.is_empty()"
            checks: [fuzz(256)]
          rust_type_from_source:
            ensures:
              - "result.is_none() || !src.is_empty()"
            checks: [fuzz(256)]
          tidy_contract_text:
            # This is the text a diagnostic quotes back as "the line you
            # wrote", so it only ever closes up spacing. Growing means it
            # has started rewriting rather than tidying.
            ensures:
              - "|result| result.len() <= s.len()"
            checks: [fuzz(256), test]
            examples:
              - "tidy_contract_text(\"| result | * result == x\") == \"|result|*result == x\""
      schedule:
        anchor: ply_core::schedule
        # No `state:` here: what this module produces is a plain pair of
        # collections rather than a named struct, so there are no field
        # names to draw beside a shape.
        note: >-
          Decides the order claims are verified in, so a callee is checked
          before a caller that stands on it. The promise below is the one
          that matters here: a node this dropped would be a claim nobody
          ever checked, and nothing else would say so.
        fns:
          order:
            # No precondition, and that is the fix rather than an omission.
            # Ply panicked this with `domain = {15}` against an empty
            # `node_ids`, which is an index used as a tie-break key without a
            # range check. Declaring the agreement as a precondition was
            # tried: true, and it threw away 1025 of 1195 generated inputs,
            # so the function earned nothing. The lookup is total now, and
            # the promise below stands over every input.
            ensures:
              - "|result| result.0.len() + result.1.len() == domain.len()"
            checks: [fuzz(256)]
      surface:
        anchor: ply_core::surface
        state:
          of: SourceSurface
          show: [markers, escapes, derived]
        fns:
          contract_helpers:
            # Everything it reports has to be visible in the text it read.
            # A name it invented would put a function on the trust surface
            # that the promise never actually calls.
            ensures:
              - "|result| result.iter().all(|n| expr_src.contains(n.rsplit(\"::\").next().unwrap_or(n.as_str())))"
            checks: [fuzz(256), test]
            examples:
              - "contract_helpers(\"tiered_fee(x) <= cap(x)\").len() == 2"
          same_expression:
            ensures:
              - "|result| *result || a != b"
            checks: [fuzz(256), test]
            examples:
              - "same_expression(\"x + 1\", \"x+1\")"
              - "!same_expression(\"x + 1\", \"x + 2\")"
      model:
        anchor: ply_core::model
        state:
          of: Document
          show: [components, edges, deny, routes]
        note: >-
          The document as data: what a ply.yaml means once it has been read.
        fns:
          parse_check:
            # Every rejection has to quote back the text it read, or the
            # person who mistyped a line in their document is told only
            # that something is wrong and never which thing.
            ensures:
              - "|result| result.is_ok() || result.as_ref().unwrap_err().contains(&format!(\"{:?}\", s.trim()))"
            checks: [fuzz(256), test]
            examples:
              - "parse_check(\"fuzz(256)\").is_ok()"
              - "parse_check(\"bounded(3)\").is_ok()"
              - "parse_check(\"mutate\").is_ok()"
          parse_deny:
            ensures:
              - "|result| result.is_ok() || result.as_ref().unwrap_err().contains(&format!(\"{:?}\", s.trim()))"
            checks: [fuzz(256), test]
            examples:
              - "parse_deny(\"a -> b\").is_ok()"
              - "parse_deny(\"a -> b except c\").is_ok()"
          parse_edge:
            ensures:
              - "|result| result.is_ok() || result.as_ref().unwrap_err().contains(&format!(\"{:?}\", s.trim()))"
            checks: [fuzz(256), test]
            examples:
              - "parse_edge(\"a -> b\").is_ok()"
              - "parse_edge(\"a ~> b : Order\").is_ok()"
      registry:
        anchor: ply_core::registry
        state:
          of: RuleEntry
          show: [code, tier, severity, gloss]
        note: >-
          Every message Ply can produce, listed once as data rather than as a
          document two people have to keep in step by hand.
        fns:
          lookup:
            # Not just "found something" -- found the right thing. A lookup
            # that returned a neighbouring row would mislabel every message
            # Ply prints.
            ensures:
              - "|result| result.is_none() || format!(\"{:?}\", result.as_ref().unwrap().code) == code.trim().to_ascii_uppercase()"
            # `fuzz` alone says almost nothing here: random text is never a
            # real code, so it only ever shows the miss. The concrete cases
            # are what exercise the hit.
            checks: [fuzz(256), test]
            examples:
              - "lookup(\"E0203\").map(|e| e.code) == Some(ply_core::registry::Code::E0203)"
              - "lookup(\" w0526 \").map(|e| e.code) == Some(ply_core::registry::Code::W0526)"
              - "lookup(\"E9999\").is_none()"
          all:
            # A duplicate code would make `cargo ply explain` ambiguous
            # about which rule a reader is looking at: two rows, one code
            # typed at the prompt, no way to say which explanation is the
            # right one.
            ensures:
              - "|result| result.iter().map(|e| e.code).collect::<std::collections::BTreeSet<_>>().len() == result.len()"
            checks: [test]
      record:
        anchor: ply_core::record
        state:
          of: RecordEntry
          show: [verdict, statuses, inputs]
        note: >-
          What was checked, and everything a result depended on. A stored
          result is only reused when every one of those inputs still hashes
          the same, which is what stops a stale green outliving the code that
          earned it.
        fns:
          fingerprint:
            ensures:
              - "result.len() == 64"
            checks: [fuzz(256)]
          verdict_is_earnable:
            # The guard against a hand-edited record. A verdict decorated as
            # spec-strong can only have been earned by a run that declared
            # `mutate`, so accepting one without it would let an edited file
            # claim evidence no run could have produced.
            ensures:
              - "|result| !*result || !verdict.ends_with(\"\u00b7spec-strong\") || checks.iter().any(|c| c == \"mutate\")"
            checks: [fuzz(256), test]
            examples:
              - "verdict_is_earnable(\"fuzzed(256)\", &[\"fuzz(256)\".to_string()], &[])"
              - "!verdict_is_earnable(\"bounded(3)\u00b7spec-strong\", &[\"bounded(3)\".to_string()], &[])"
      schema:
        anchor: ply_core::schema
        state:
          of: SchemaViolation
          show: [code, pointer, message]
        fns:
          dotted:
            ensures:
              - "|result| !result.starts_with('/')"
            checks: [fuzz(256)]
          unknown_key_message:
            # The reader is being told they typed a key Ply does not know.
            # A message that does not repeat the key back leaves them
            # searching the document for which one it meant.
            ensures:
              - "|result| result.contains(&name[..])"
            checks: [fuzz(256)]
          validate_text:
            # Every violation has to say where it is. A blank location is
            # a finding the reader cannot act on.
            ensures:
              - "|result| result.as_ref().map(|vs| vs.iter().all(|v| !v.pointer.is_empty() || !v.message.is_empty())).unwrap_or(true)"
            checks: [fuzz(256)]
          is_identifier:
            ensures:
              - "|result| !*result || !s.is_empty()"
            checks: [fuzz(256)]
          known_keys:
            # The vocabulary a document is allowed to use and the validator
            # that rejects an unknown key are two different pieces of code;
            # this is what stops them drifting apart -- every key this
            # returns has to satisfy the schema's own identifier grammar,
            # or a key nobody could ever type validly would still be
            # advertised as known.
            ensures:
              - "|result| result.iter().all(|k| ply_core::schema::is_identifier(k))"
            checks: [fuzz(256)]
          nearest_key:
            ensures:
              - "|result| result.is_none() || !known.is_empty()"
            checks: [fuzz(256)]
      engines:
        anchor: ply_core::engines
        components:
          fuzz_engine:
            anchor: ply_core::engines::fuzz
            state:
              of: HarnessTestRun
              show: [timed_out, success, combined_output, failed_tests]
            note: >-
              Reads what the sampling engine actually printed. Everything
              here is a parser over another tool's output, so the promises
              are all the same shape: never report something the output did
              not contain.
            fns:
              count_tests_executed:
                # The count that decides whether a check ran at all, so a
                # number larger than the output could hold would let a run
                # that compiled nothing report cases it never ran.
                ensures:
                  - "|result| (*result as usize) <= combined.lines().count()"
                checks: [fuzz(256), test]
                examples:
                  - "count_tests_executed(\"test m::a ... ok\\ntest m::b ... FAILED\\n\", \"m::\") == 2"
                  - "count_tests_executed(\"test other::a ... ok\\n\", \"m::\") == 0"
              parse_fuzz_marker:
                # Never names a function the output did not name. An
                # invented one would attach a real counterexample to the
                # wrong claim.
                ensures:
                  - "|result| result.iter().all(|(fn_name, _)| combined.contains(fn_name.as_str()))"
                checks: [fuzz(256), test]
                examples:
                  - "parse_fuzz_marker(\"PLY_FUZZED_CEX|clamp|x=7\\n\").is_some()"
                  - "parse_fuzz_marker(\"nothing here\\n\").is_none()"
              parse_proptest_minimal_input:
                # `Some` with nothing in it would read as "a counterexample
                # was found and it has no inputs", which is not a thing.
                ensures:
                  - "|result| result.iter().all(|v| !v.is_empty())"
                checks: [fuzz(256), test]
                examples:
                  - "parse_proptest_minimal_input(\"minimal failing input: 7\\ntest x ... FAILED\\n\").is_some()"
                  - "parse_proptest_minimal_input(\"clean run\\n\").is_none()"
              build_errors_with_lines:
                # One error per line at most: more would mean the same
                # compiler line was reported twice at different places.
                ensures:
                  - "|result| result.len() <= combined.lines().count()"
                checks: [fuzz(256)]
              first_build_error:
                # Never invents a compiler error. A fabricated one would be
                # blamed on the user's code.
                ensures:
                  - "|result| result.iter().all(|e| combined.contains(e.as_str()))"
                checks: [fuzz(256), test]
                examples:
                  - "first_build_error(\"error[E0425]: cannot find value\\n\").is_some()"
                  - "first_build_error(\"all good\\n\").is_none()"
          kani_engine:
            anchor: ply_core::engines::kani
            state:
              of: KaniRunConfig
              show: [crate_dir, harness_path, engine_timeout_secs, enable_stubbing]
            fns:
              unstable_flags:
                # The flags go onto a command line in pairs, `-Z` then its
                # value. An odd-length list would build a malformed command
                # and the proof engine would fail for a reason that has
                # nothing to do with the code being checked.
                ensures:
                  - "|result| result.len() % 2 == 0"
                checks: [fuzz(256)]
              classify_probe:
                # Kani renders a timeout and a real failing check behind the
                # same "VERIFICATION:- FAILED" line -- reading only that far
                # would report a proof engine that simply ran out of time as
                # a genuine counterexample. A result naming a real refutation
                # must never coincide with the engine's own timeout marker.
                ensures:
                  - "|result| !matches!(result, ply_core::engines::kani::ProbeOutcome::Refuted) || !combined.contains(\"CBMC timed out\")"
                # Random text almost never contains the literal marker
                # Kani prints, so fuzzing alone would only ever exercise the
                # boring half of this -- the worked cases are what exercise
                # the timeout branch at all.
                checks: [fuzz(256), test]
                examples:
                  - "matches!(classify_probe(\"VERIFICATION:- FAILED\\nCBMC timed out\\n\"), ply_core::engines::kani::ProbeOutcome::Undecided(_))"
                  - "classify_probe(\"VERIFICATION:- SUCCESSFUL\\n\") == ply_core::engines::kani::ProbeOutcome::Holds"
                  - "classify_probe(\"VERIFICATION:- FAILED\\n\") == ply_core::engines::kani::ProbeOutcome::Refuted"
              parse_output:
                # The same reading discipline as `classify_probe`, at the
                # tier that also carries a counterexample witness: a run
                # that timed out must never come back reported as a
                # `Violation`, which is the one thing a reader would trust
                # completely -- a concrete input that breaks the promise.
                ensures:
                  - "|result| !matches!(result, ply_core::engines::kani::KaniOutcome::Violation { .. }) || !combined.contains(\"CBMC timed out\")"
                checks: [fuzz(256), test]
                examples:
                  - "matches!(parse_output(\"VERIFICATION:- FAILED\\nCBMC timed out\\n\"), ply_core::engines::kani::KaniOutcome::Timeout { .. })"
                  - "matches!(parse_output(\"VERIFICATION:- SUCCESSFUL\\n\"), ply_core::engines::kani::KaniOutcome::Verified)"
        state:
          of: TimedOutput
          show: [stdout, stderr, status]
        note: >-
          The adapters that drive each outside checking tool as a separate
          program and read back what it said. Ply never re-implements a
          checker; everything here is translation, in both directions.
        fns:
          strip_ansi:
            ensures:
              - "|result| result.len() <= text.len()"
            checks: [fuzz(256)]
      check:
        anchor: ply_core::check
        # No `state:` here, and it is not an oversight: this crate declares
        # two types called `Diagnostic`, one here and one in `diag`. Ply
        # refuses to guess which a component holds rather than picking one,
        # and renaming either is a change to the code, not to this document.
        note: >-
          The fast pass: everything Ply can say about a document without
          running anything.
        fns:
          is_valid_path_form:
            # Accepting a name that is not a Rust path would send the
            # resolver hunting for something that cannot exist.
            ensures:
              - "|result| !*result || s.chars().all(|c| c.is_ascii_alphanumeric() || c == '_' || c == ':')"
            checks: [fuzz(256), test]
            examples:
              - "is_valid_path_form(\"schema::dotted\")"
              - "!is_valid_path_form(\"\")"
              - "!is_valid_path_form(\"1bad\")"
              - "!is_valid_path_form(\"a::\")"
          mutate_kill_signal_message:
            # The newbie bar, as a promise: a message that does not say
            # where the problem is sends the reader looking through the
            # whole document for it.
            ensures:
              - "|result| result.contains(&location[..])"
            checks: [fuzz(256)]
      diag:
        anchor: ply_core::diag
        # Not `Diagnostic`: this crate declares two types by that name, one
        # here and one in `check`, and Ply refuses to guess which a component
        # holds rather than picking one. `Counterexample` is the part of a
        # finding that matters most to a reader anyway -- the input that
        # broke the promise, and whether it could be written back out as a
        # test they can run.
        state:
          of: Counterexample
          show: [inputs, kani_witness, cargo_test]
        fns:
          is_absence:
            # A fixed vocabulary, so the worked cases are the check: every
            # name that means "nothing was gathered", and one that does not.
            checks: [test]
            examples:
              - "is_absence(\"timeout\")"
              - "is_absence(\"unclaimed\")"
              - "is_absence(\"engine-missing\")"
              - "is_absence(\"inconclusive\")"
              - "is_absence(\"unsupported: no strategy\")"
              - "is_absence(\"tool_error: harness\")"
              - "!is_absence(\"proved\")"
              - "!is_absence(\"fuzzed(256)\")"
      callgraph:
        anchor: ply_core::callgraph
        state:
          of: ResolvedCall
          show: [site, status]
        fns:
          path_dependency:
            # An empty path would be joined onto the crate directory and
            # resolve to the crate itself, which is a silently wrong answer
            # rather than a missing one.
            ensures:
              - "|result| result.iter().all(|p| !p.is_empty())"
            checks: [fuzz(256), test]
            examples:
              - "path_dependency(\"[dependencies]\\nfoo = { path = \\\"../foo\\\" }\\n\", \"foo\") == Some(\"../foo\".to_string())"
              - "path_dependency(\"[dependencies]\\nfoo = \\\"1.0\\\"\\n\", \"foo\").is_none()"
      reach:
        anchor: ply_core::reach
        state:
          of: FirstParty
          show: [units, gate]
        fns:
          path_dependencies:
            # Never reports a dependency the manifest does not name.
            ensures:
              - "|result| result.iter().all(|(name, _)| manifest.contains(name.as_str()))"
            checks: [fuzz(256), test]
            examples:
              - "reach::path_dependencies(\"[dependencies]\\nfoo = { path = \\\"../foo\\\" }\\n\").len() == 1"
      config:
        anchor: ply_core::config
        # No `state:` here, deliberately: this module declares no type of its
        # own. It reads a document and hands back a `Document`, which belongs
        # to `model` and is drawn there.
        note: >-
          Reading a ply.yaml and refusing one that is not valid, before any
          engine is asked to do anything.
        fns:
          validate_keys:
            # The code is the thing a reader types into `cargo ply explain`.
            # A rejection without one is a dead end.
            ensures:
              - "|result| result.is_ok() || result.as_ref().unwrap_err().to_string().contains(\"E0\")"
            checks: [fuzz(256), test]
            examples:
              - "validate_keys(\"ply: 1\\ncomponents: {}\\n\").is_ok()"
              - "validate_keys(\"ply: 1\\nnonsense_key: 1\\n\").is_err()"
          parse_check_string:
            # The code is what a reader types into `cargo ply explain`, so a
            # rejection that omits it leaves them with nowhere to go.
            ensures:
              - "|result| result.is_ok() || result.as_ref().unwrap_err().to_string().contains(\"E0203\")"
            checks: [fuzz(256), test]
            examples:
              - "parse_check_string(\"fuzz(256)\").is_ok()"
              - "parse_check_string(\"nonsense\").is_err()"
      fuzz_gen:
        anchor: ply_core::fuzz_gen
        state:
          of: ParamSeedPlan
          show: [param_name, shape, examples_seeds]
        fns:
          derive_seed:
            # The two inputs are kept apart by a separator, so swapping
            # them gives a different seed. Remove that separator and this
            # goes red: `("ab", "c")` and `("a", "bc")` would then hash the
            # same, and two different promises would be checked against the
            # same generated inputs while looking independent.
            ensures:
              - "|result| fn_name == contract_text || *result != derive_seed(&contract_text, &fn_name)"
            checks: [fuzz(256), test]
            examples:
              - "derive_seed(\"ab\", \"c\") != derive_seed(\"a\", \"bc\")"
          seed_from_hex:
            # A seed is 32 bytes written as 64 hex characters. Accepting
            # anything else would silently give a run a different corpus
            # from the one the document asked for.
            ensures:
              - "|result| result.is_none() || text.trim().len() == 64"
            checks: [fuzz(256), test]
            examples:
              - "seed_from_hex(&\"ab\".repeat(32)).is_some()"
              - "seed_from_hex(\"abcd\").is_none()"
              - "seed_from_hex(&\"zz\".repeat(32)).is_none()"
          seed_hex:
            ensures:
              - "|result| result.len() == 64"
            checks: [fuzz(256)]
          classify_seedable_wrap:
            # A fixed, tiny vocabulary -- exactly the two spellings the
            # seeding apparatus below this actually knows how to grow a
            # corpus for. Naming a shape for source text that is not one of
            # those two spellings would tell a later caller a parameter can
            # be seeded when nothing here can vary it.
            ensures:
              - "|result| match result { None => true, Some(ply_core::fuzz_gen::SeedableWrap::OptionString) => source == \"Option<String>\", Some(ply_core::fuzz_gen::SeedableWrap::VecString) => source == \"Vec<String>\" }"
            checks: [fuzz(256), test]
            examples:
              - "classify_seedable_wrap(\"Option<String>\") == Some(ply_core::fuzz_gen::SeedableWrap::OptionString)"
              - "classify_seedable_wrap(\"Vec<String>\") == Some(ply_core::fuzz_gen::SeedableWrap::VecString)"
              - "classify_seedable_wrap(\"Option<u32>\").is_none()"
          extract_examples_seed_strings:
            # Every seed this hands to the sampling engine has to be text
            # the author actually wrote in an `examples:` entry -- an
            # invented one would grow a corpus from a value nobody wrote
            # down and report cases that were never really seeded.
            ensures:
              - "|result| result.iter().all(|s| examples.iter().any(|e| e.contains(s.as_str())))"
            # Random text almost never parses as a call to `ctor_path` at
            # all, so fuzzing alone only ever shows the empty miss -- the
            # worked cases are what exercise a real extraction.
            checks: [fuzz(256), test]
            examples:
              - 'extract_examples_seed_strings(&["Order::new(\"abc\")".to_string()], "Order::new") == vec!["abc".to_string()]'
              - 'extract_examples_seed_strings(&["other_fn(\"x\")".to_string()], "Order::new").is_empty()'
          extract_examples_seed_strings_for_param:
            # Same promise as the constructor-call extractor, at the
            # positional-argument shape a plain parameter uses: nothing
            # comes back that the author did not write into an `examples:`
            # entry.
            ensures:
              - "|result| result.iter().all(|s| examples.iter().any(|e| e.contains(s.as_str())))"
            checks: [fuzz(256), test]
            examples:
              - 'extract_examples_seed_strings_for_param(&["handle(0, \"seed1\")".to_string()], "handle", 1) == vec!["seed1".to_string()]'
              - 'extract_examples_seed_strings_for_param(&["handle(0, \"seed1\")".to_string()], "handle", 0).is_empty()'
      harness_crate:
        anchor: ply_core::harness_crate
        state:
          of: HarnessModule
          show: [fn_ident, source]
        note: >-
          Writes the generated harness crate. Almost all of it is filesystem
          work, and that is the honest shape of it -- but the one real piece
          of reasoning in here was welded to a write until 2026-09-04, and so
          could not be checked. Split out, it can be.
        fns:
          harness_lib_source:
            ensures:
              - "result.1.len() == fn_modules.len()"
            checks: [fuzz(256)]
          harness_package_name:
            ensures:
              - "|result| result.ends_with(\"-ply-harness\")"
            checks: [fuzz(256)]
          harness_rel_path:
            ensures:
              - "|result| result.starts_with(\"target/ply/fuzz/\")"
            checks: [fuzz(256)]
          crate_has_workspace_table:
            # `[workspace.dependencies]` is not `[workspace]`, and reading it
            # as one would make Ply edit a manifest that owns no members.
            ensures:
              - "|result| !*result || cargo_toml_text.contains(\"[workspace]\")"
            checks: [fuzz(256), test]
            examples:
              - "crate_has_workspace_table(\"[workspace]\\n\")"
              - "crate_has_workspace_table(\"  [workspace]  \\n\")"
              - "!crate_has_workspace_table(\"[workspace.dependencies]\\n\")"
          remove_workspace_member:
            ensures:
              - "|result| result.len() <= text.len()"
            checks: [fuzz(256)]
      state_shapes:
        anchor: ply_core::visual::state_shapes
        state:
          of: RowSpec
          show: [name, shape, origin]
        note: >-
          Which glyph a field's row draws, and whether it was read off real
          code or only declared. The hatch is the one visual cue saying a
          field is a guess rather than a fact, so it has to survive every
          shape it might be drawn on top of.
        fns:
          glyph_svg:
            # The hatch replaces a glyph's own fill or ink, never its own
            # shape -- a reader still has to see which field could not be
            # built. A field marked `hatched` that came back without the
            # hatch class would tell the reader that field was checked when
            # it was only guessed at.
            ensures:
              - "|result| !hatched || result.contains(\"state-glyph-hatched\")"
            checks: [fuzz(256)]
      layout:
        anchor: ply_core::visual::layout
        state:
          of: LayeredLayout
          show: [positions, content_w, content_h]
        note: >-
          Where each box goes. The promise below is that it never invents
          one: a rank for a name the document never declared would draw
          something nobody wrote.
        fns:
          assign_ranks:
            ensures:
              - "|result| result.len() <= names.len()"
            checks: [fuzz(256)]
      svg:
        anchor: ply_core::visual::svg
        state:
          of: RenderOptions
          show: [depth, focus, collapse]
        note: >-
          Turns the document into the picture. The promises here are about
          the sentences a reader sees, not the shapes.
        fns:
          examples_prose:
            # The count is the whole point of the sentence. Dropping it
            # leaves the reader told there are examples but not how many.
            ensures:
              - "|result| result.contains(&n.to_string())"
            checks: [fuzz(256)]
      visual:
        anchor: ply_core::visual
        state:
          of: VisualEnvelope
          show: [svg, elements, diagnostics]
        note: >-
          The drawing, the prose form of the same facts, and the portable
          package an editor reads. Nothing here decides anything; it only
          shows what was decided.
        fns:
          stable_element_id:
            ensures:
              - "result.starts_with(\"ply-\")"
            checks: [fuzz(256)]
