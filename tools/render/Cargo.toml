[package]
name = "ply-render"
version = "0.1.0"
edition = "2024"

[lib]
name = "ply_render"
path = "src/lib.rs"

[[bin]]
name = "ply-render"
path = "src/main.rs"

[dependencies]
ply-core = { path = "../../crates/ply-core" }
ply-kernel = { path = "../kernel" }
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
insta = "1"
roxmltree = "0.20"
tempfile = "3"
