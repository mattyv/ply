[workspace]
resolver = "3"
members = [
    "crates/ply-diag",
    "crates/ply-syntax",
    "crates/ply-driver",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mattyv/ply"

[workspace.dependencies]
ply-diag = { path = "crates/ply-diag" }
ply-syntax = { path = "crates/ply-syntax" }

logos = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
insta = { version = "1", features = ["json"] }
proptest = "1"
